name: SureCast
options:
  bundleIdPrefix: com.willspro
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: T5D465LUGX
    CODE_SIGN_STYLE: Automatic
targets:
  SureCast:
    type: application
    platform: iOS
    sources:
      - path: SureCast
        excludes:
          - web
      - path: SureCast/web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.willspro.tideline
        PRODUCT_NAME: SureCast
        MARKETING_VERSION: "0.23"
        CURRENT_PROJECT_VERSION: "23"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SureCast
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Shows wind, waves and tides for where you're fishing.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
